    <style>

        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(to bottom right, #2B394D, #0F161F);
        transition: opacity 0.25s ease-out;
      }
      #splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: 104px;
        height: 96px;
        animation: splash-enter 0.88s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      #splash .splash-ribbon {
        animation: splash-breathe 1.8s ease-in-out infinite;
      }
      #splash .splash-ribbon-back {
        animation-delay: 0.9s;
      }
      #splash p {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 48px;
        margin: 0;
        text-align: center;
        font: 600 17px/22px 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #FFFFFF;
        animation: splash-fade 0.48s ease 0.8s both;
      }
      @keyframes splash-enter {
        from { opacity: 0; transform: scale(1.5); }
      }
      @keyframes splash-fade {
        from { opacity: 0; }
      }
      @keyframes splash-breathe {
        50% { opacity: 0.4; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
    <noscript><style>#splash { display: none; }</style></noscript>
