app = "retrieval-server"
# Co-located with the proxy server and DynamoDB (us-east-1)
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5001"
  # Production logging: WARNING+ only (app.py derives the level from APP_ENV;
  # LOG_LEVEL env overrides), and user-content logging (prompts, responses,
  # memories) is disabled regardless of level — see content_logging.py.
  APP_ENV = "production"

# Traffic arrives via Flycast (http://<app-name>.flycast, port 80), same as dev:
# fly-proxy can start a crash-stopped machine on the next request — on the old
# .internal path nothing could (2026-10-10 outage: a boot-crashing image
# exhausted Fly's restart budget and the machine stayed stopped through a
# "successful" redeploy). Only a private Flycast IP is allocated — no public
# IPs — so the app remains unreachable from the public internet.
#
# min_machines_running = 1 keeps one machine up under normal load; the 2nd
# machine (scale count 2) is a cold standby — auto_stop_machines lets Fly
# stop it when idle (unbilled while stopped) and auto_start_machines lets Fly
# start it on the next request if the primary exhausts its restart budget and
# stays down (the 2026-10-10 scenario above).
[http_service]
  internal_port = 5001
  force_https = false
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

# Machine-level health check: `fly deploy` won't call the machine good until
# /health answers, so an image that can't boot fails the deploy (red CI run)
# instead of shipping green.
[checks]
  [checks.health]
    type = "http"
    port = 5001
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# Fly's org-level Prometheus scrapes /metrics over the private network —
# the app stays internal-only. Dashboards: fly-metrics.net / Grafana Cloud.
[metrics]
  port = 5001
  path = "/metrics"

# Right-sized 2026-09: embeddings are API-backed (Voyage) — no local torch /
# sentence-transformers resident in memory, and CPU sat under 1% of one core.
# Bumped 1024mb -> 2048mb 2026-10-25: process RSS was climbing to the 1 GB
# ceiling and getting OOM-killed every ~3.5h (root cause still open).
[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"
