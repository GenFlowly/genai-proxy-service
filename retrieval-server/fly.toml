app = "retrieval-server"
# Co-located with the proxy server and DynamoDB (us-east-1)
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5001"
  HF_HOME = "/app/model_cache"

[[mounts]]
  source = "model_cache"
  destination = "/app/model_cache"

# Dev only (prod uses fly.production.toml): traffic arrives via Flycast
# (http://<app-name>.flycast, port 80) so fly-proxy can auto stop/start the
# machine on idle/traffic. The app has only a private Flycast IP allocated —
# no public IPs — so it is still unreachable from the public internet.
[http_service]
  internal_port = 5001
  force_https = false
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

# Fly's org-level Prometheus scrapes /metrics over the private network —
# the app stays internal-only. Dashboards: fly-metrics.net / Grafana Cloud.
[metrics]
  port = 5001
  path = "/metrics"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4096mb"

