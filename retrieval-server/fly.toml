app = "retrieval-server"
# Co-located with the proxy server and DynamoDB (us-east-1)
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5001"
  # Dev logs everything: INFO level + user content (prompts, responses,
  # memories) — see app.py and content_logging.py
  APP_ENV = "development"

# Dev only (prod uses fly.production.toml): traffic arrives via Flycast
# (http://<app-name>.flycast, port 80) so fly-proxy can auto stop/start the
# machine on idle/traffic. The app has only a private Flycast IP allocated —
# no public IPs — so it is still unreachable from the public internet.
[http_service]
  internal_port = 5001
  force_https = false
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

# Machine-level health check: `fly deploy` won't call a running machine good
# until /health answers, so an image that can't boot fails the deploy (red CI
# run) instead of shipping green.
[checks]
  [checks.health]
    type = "http"
    port = 5001
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# Fly's org-level Prometheus scrapes /metrics over the private network —
# the app stays internal-only. Dashboards: fly-metrics.net / Grafana Cloud.
[metrics]
  port = 5001
  path = "/metrics"

# Right-sized 2026-09: embeddings are API-backed (Voyage) — no local torch /
# sentence-transformers resident in memory, and CPU sat under 1% of one core.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"

