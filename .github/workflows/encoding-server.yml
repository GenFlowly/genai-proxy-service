name: Encoding Server

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      GH_PAT_TOKEN_FOR_FREE_ACCOUNT:
        required: true

env:
  AWS_REGION: us-east-1
  ENCODING_CDK_PATH: encoding-server-cdk
  AUTH0_SPA_DOMAIN: ${{ secrets.AUTH0_SPA_DOMAIN }}

jobs:
  deploy:
    name: Beta
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .npmrc file
        working-directory: ${{ env.ENCODING_CDK_PATH }}
        run: |
          echo "@genflowly:registry=https://npm.pkg.github.com/" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}" >> .npmrc

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install dependencies
        working-directory: ${{ env.ENCODING_CDK_PATH }}
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}


      - name: Deploy ECR stack first to create repositories
        working-directory: ${{ env.ENCODING_CDK_PATH }}
        run: |
          echo "Deploying ECR stack to create repositories..."
          cdk deploy encoding-service-EcrStack --require-approval never

      - name: Get ECR Repository URIs
        id: get-ecr-uri
        run: |
          INGESTION_ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name encoding-service-EcrStack \
            --query "Stacks[0].Outputs[?OutputKey=='IngestionRepoUri'].OutputValue" \
            --output text)
          echo "INGESTION_ECR_URI=$INGESTION_ECR_URI" >> $GITHUB_ENV
          echo "INGESTION_ECR_REPO=$(basename $INGESTION_ECR_URI)" >> $GITHUB_ENV
          echo "Using Ingestion Lambda ECR: $INGESTION_ECR_URI"
          
          ENCODE_ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name encoding-service-EcrStack \
            --query "Stacks[0].Outputs[?OutputKey=='EncodeRepoUri'].OutputValue" \
            --output text)
          echo "ENCODE_ECR_URI=$ENCODE_ECR_URI" >> $GITHUB_ENV
          echo "ENCODE_ECR_REPO=$(basename $ENCODE_ECR_URI)" >> $GITHUB_ENV
          echo "Using Encode Lambda ECR: $ENCODE_ECR_URI"
          
          STORE_EMBEDDINGS_ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name encoding-service-EcrStack \
            --query "Stacks[0].Outputs[?OutputKey=='StoreEmbeddingsRepoUri'].OutputValue" \
            --output text)
          echo "STORE_EMBEDDINGS_ECR_URI=$STORE_EMBEDDINGS_ECR_URI" >> $GITHUB_ENV
          echo "STORE_EMBEDDINGS_ECR_REPO=$(basename $STORE_EMBEDDINGS_ECR_URI)" >> $GITHUB_ENV
          echo "Using Store Embeddings Lambda ECR: $STORE_EMBEDDINGS_ECR_URI"
          
          STORE_S3_ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name encoding-service-EcrStack \
            --query "Stacks[0].Outputs[?OutputKey=='StoreS3RepoUri'].OutputValue" \
            --output text)
          echo "STORE_S3_ECR_URI=$STORE_S3_ECR_URI" >> $GITHUB_ENV
          echo "STORE_S3_ECR_REPO=$(basename $STORE_S3_ECR_URI)" >> $GITHUB_ENV
          echo "Using Store S3 Lambda ECR: $STORE_S3_ECR_URI"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Free up disk space before building
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          # Remove huge unnecessary tools
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          
          # Remove unused Docker images and build cache
          docker system prune -af --volumes
          
          # Remove unused packages
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          
          echo "Disk space after cleanup:"
          df -h

      - name: Build ingestion Lambda Docker image
        working-directory: encoding-server
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -f Dockerfile.ingestion -t ingestion-lambda:$IMAGE_TAG .
          docker tag ingestion-lambda:$IMAGE_TAG $ECR_REGISTRY/$INGESTION_ECR_REPO:ingestion-$IMAGE_TAG
          docker tag ingestion-lambda:$IMAGE_TAG $ECR_REGISTRY/$INGESTION_ECR_REPO:ingestion-latest
          echo "INGESTION_IMAGE_URI=$ECR_REGISTRY/$INGESTION_ECR_REPO:ingestion-$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push ingestion Lambda Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $INGESTION_IMAGE_URI
          docker push $ECR_REGISTRY/$INGESTION_ECR_REPO:ingestion-latest
          echo "Pushed ingestion Lambda: $INGESTION_IMAGE_URI and ingestion-latest"

      - name: Build Encode Lambda Docker image
        working-directory: encoding-server
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -f Dockerfile.encode -t encode-lambda:$IMAGE_TAG .
          docker tag encode-lambda:$IMAGE_TAG $ECR_REGISTRY/$ENCODE_ECR_REPO:encode-$IMAGE_TAG
          docker tag encode-lambda:$IMAGE_TAG $ECR_REGISTRY/$ENCODE_ECR_REPO:encode-latest
          echo "ENCODE_IMAGE_URI=$ECR_REGISTRY/$ENCODE_ECR_REPO:encode-$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Encode Lambda Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ENCODE_IMAGE_URI
          docker push $ECR_REGISTRY/$ENCODE_ECR_REPO:encode-latest
          echo "Pushed Encode Lambda: $ENCODE_IMAGE_URI and encode-latest"

      - name: Build Store Embeddings Lambda Docker image
        working-directory: encoding-server
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -f Dockerfile.store_embeddings -t store-embeddings-lambda:$IMAGE_TAG .
          docker tag store-embeddings-lambda:$IMAGE_TAG $ECR_REGISTRY/$STORE_EMBEDDINGS_ECR_REPO:store-embeddings-$IMAGE_TAG
          docker tag store-embeddings-lambda:$IMAGE_TAG $ECR_REGISTRY/$STORE_EMBEDDINGS_ECR_REPO:store-embeddings-latest
          echo "STORE_EMBEDDINGS_IMAGE_URI=$ECR_REGISTRY/$STORE_EMBEDDINGS_ECR_REPO:store-embeddings-$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Store Embeddings Lambda Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $STORE_EMBEDDINGS_IMAGE_URI
          docker push $ECR_REGISTRY/$STORE_EMBEDDINGS_ECR_REPO:store-embeddings-latest
          echo "Pushed Store Embeddings Lambda: $STORE_EMBEDDINGS_IMAGE_URI and store-embeddings-latest"

      - name: Build Store S3 Lambda Docker image
        working-directory: encoding-server
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -f Dockerfile.store_s3 -t store-s3-lambda:$IMAGE_TAG .
          docker tag store-s3-lambda:$IMAGE_TAG $ECR_REGISTRY/$STORE_S3_ECR_REPO:store-s3-$IMAGE_TAG
          docker tag store-s3-lambda:$IMAGE_TAG $ECR_REGISTRY/$STORE_S3_ECR_REPO:store-s3-latest
          echo "STORE_S3_IMAGE_URI=$ECR_REGISTRY/$STORE_S3_ECR_REPO:store-s3-$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Store S3 Lambda Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $STORE_S3_IMAGE_URI
          docker push $ECR_REGISTRY/$STORE_S3_ECR_REPO:store-s3-latest
          echo "Pushed Store S3 Lambda: $STORE_S3_IMAGE_URI and store-s3-latest"

      - name: Deploy S3Stack, SqsStack, LambdaStack, StepFunctionsStack, ApiGatewayStack
        working-directory: ${{ env.ENCODING_CDK_PATH }}
        env:
          INGESTION_IMAGE_URI: ${{ env.INGESTION_IMAGE_URI }}
        run: cdk deploy encoding-service-S3Stack encoding-service-SqsStack encoding-service-LambdaStack encoding-service-StepFunctionsStack encoding-service-ApiGatewayStack --require-approval never
