name: Encoding Server

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      GH_PAT_TOKEN_FOR_FREE_ACCOUNT:
        required: true

env:
  AWS_REGION: us-east-1
  ENCODING_CDK_PATH: encoding-server-cdk

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes in Lambdas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ingestion:
              - 'encoding-server/handlers/ingestion_lambda.py'
              - 'encoding-server/Dockerfile.ingestion'
              - 'encoding-server/factory/**'
              - 'encoding-server/processors/**'
            processing:
              - 'encoding-server/handlers/processing_lambda.py'
              - 'encoding-server/Dockerfile.processing'
            shared:
              - 'encoding-server/requirements.txt'
              - 'encoding-server/email_model.py'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .npmrc file
        working-directory: ${{ env.ENCODING_CDK_PATH }}
        run: |
          echo "@genflowly:registry=https://npm.pkg.github.com/" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}" >> .npmrc

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install dependencies
        working-directory: ${{ env.ENCODING_CDK_PATH }}
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}

      - name: Bootstrap ECR stack if needed (first deployment only)
        working-directory: ${{ env.ENCODING_CDK_PATH }}
        run: |
          # Check if ECR stack exists
          if ! aws cloudformation describe-stacks --stack-name encoding-service-EcrStack 2>/dev/null; then
            echo "ECR stack doesn't exist, deploying it first..."
            cdk deploy encoding-service-EcrStack --require-approval never
          else
            echo "ECR stack already exists, will update with all stacks together"
          fi

      - name: Get ECR Repository URIs
        id: get-ecr-uri
        run: |
          PROCESSING_ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name encoding-service-EcrStack \
            --query "Stacks[0].Outputs[?OutputKey=='ProcessingRepoUri'].OutputValue" \
            --output text)
          echo "PROCESSING_ECR_URI=$PROCESSING_ECR_URI" >> $GITHUB_ENV
          echo "PROCESSING_ECR_REPO=$(basename $PROCESSING_ECR_URI)" >> $GITHUB_ENV
          echo "Using Processing Lambda ECR URI: $PROCESSING_ECR_URI"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build ingestion Lambda Docker image
        if: steps.filter.outputs.ingestion == 'true' || steps.filter.outputs.shared == 'true'
        working-directory: encoding-server
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -f Dockerfile.ingestion -t ingestion-lambda:$IMAGE_TAG .
          docker tag ingestion-lambda:$IMAGE_TAG $ECR_REGISTRY/$PROCESSING_ECR_REPO:ingestion-$IMAGE_TAG
          echo "INGESTION_IMAGE_URI=$ECR_REGISTRY/$PROCESSING_ECR_REPO:ingestion-$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push ingestion Lambda Docker image to ECR
        if: steps.filter.outputs.ingestion == 'true' || steps.filter.outputs.shared == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $INGESTION_IMAGE_URI
          echo "Pushed ingestion Lambda: $INGESTION_IMAGE_URI"

      - name: Build processing Lambda Docker image
        if: steps.filter.outputs.processing == 'true' || steps.filter.outputs.shared == 'true'
        working-directory: encoding-server
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -f Dockerfile.processing -t processing-lambda:$IMAGE_TAG .
          docker tag processing-lambda:$IMAGE_TAG $ECR_REGISTRY/$PROCESSING_ECR_REPO:processing-$IMAGE_TAG
          echo "PROCESSING_IMAGE_URI=$ECR_REGISTRY/$PROCESSING_ECR_REPO:processing-$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push processing Lambda Docker image to ECR
        if: steps.filter.outputs.processing == 'true' || steps.filter.outputs.shared == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $PROCESSING_IMAGE_URI
          echo "Pushed processing Lambda: $PROCESSING_IMAGE_URI"

      - name: Deploy EcrStack, S3Stack, SqsStack, LambdaStack, ApiGatewayStack
        working-directory: ${{ env.ENCODING_CDK_PATH }}
        env:
          INGESTION_IMAGE_URI: ${{ env.INGESTION_IMAGE_URI }}
          PROCESSING_IMAGE_URI: ${{ env.PROCESSING_IMAGE_URI }}
        run: cdk deploy encoding-service-EcrStack encoding-service-S3Stack encoding-service-SqsStack encoding-service-LambdaStack encoding-service-ApiGatewayStack --require-approval never
