name: Development Proxy Server

# Deploys the proxy server (AWS/CDK) and the retrieval server (Fly.io).
# Self-triggered: runs only when these services (or this workflow) change.
on:
  push:
    branches: [development]
    paths:
      - 'genai-proxy-server/**'
      - 'genai-proxy-server-cdk/**'
      # The support API has its own workflow (*-support-api.yml).
      - '!genai-proxy-server-cdk/lib/support-stack.ts'
      - '!genai-proxy-server-cdk/lambda/support/**'
      - '!genai-proxy-server-cdk/bin/support.ts'
      - 'retrieval-server/**'
      - '.github/workflows/dev-proxy-server.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CDK_APP_PATH: genai-proxy-server-cdk
  SERVICE_APP_PATH: genai-proxy-server
  AUTH0_SPA_DOMAIN: ${{ secrets.AUTH0_SPA_DOMAIN }}
  AUTH0_API_AUDIENCE: ${{ secrets.AUTH0_API_AUDIENCE }}
  ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
  AUTH0_REACT_APP_CLIENT_IDS: ${{ secrets.AUTH0_REACT_APP_CLIENT_IDS }}
  AUTH0_ADMIN_PANEL_CLIENT_IDS: ${{ secrets.AUTH0_ADMIN_PANEL_CLIENT_IDS }}
  STAGE: development

jobs:
  deploy:
    name: Beta
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: retrieval-server/requirements.lock.txt

      # The same push that bumps the encoding-library pin also publishes it
      # (publish-encoding-library.yml) — pip here can race the PyPI upload
      # and its CDN propagation, which failed this very deploy twice on
      # 2026-10-30. Wait for the pinned version to be servable first.
      - name: Wait for the pinned encoding-library on PyPI
        working-directory: retrieval-server
        run: |
          VERSION=$(sed -n 's/^genflowly-encoding-library==\(.*\)$/\1/p' requirements.lock.txt | head -1)
          if [ -z "$VERSION" ]; then echo "::error::no encoding-library pin found in requirements.lock.txt"; exit 1; fi
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/genflowly-encoding-library/${VERSION}/json" > /dev/null; then
              echo "genflowly-encoding-library ${VERSION} is on PyPI"; exit 0
            fi
            echo "waiting for genflowly-encoding-library ${VERSION} on PyPI (${i}/30)"; sleep 10
          done
          echo "::error::genflowly-encoding-library ${VERSION} never appeared on PyPI"; exit 1

      - name: Test Retrieval Server
        working-directory: retrieval-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -q flake8 flake8-bugbear
          flake8 . --count --select=E9,F63,F7,F82,B019 --show-source --statistics
          python -m unittest discover -s tests -t . -v

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .npmrc file
        working-directory: ${{ env.CDK_APP_PATH }}
        run: |
          echo "@genflowly:registry=https://npm.pkg.github.com/" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}" >> .npmrc

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install dependencies
        working-directory: ${{ env.CDK_APP_PATH }}
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}

      - name: Deploy KMS stack
        working-directory: ${{ env.CDK_APP_PATH }}
        run: cdk deploy gen-ai-proxy-service-KmsStack --require-approval never

      - name: Deploy DynamoDB stack
        working-directory: ${{ env.CDK_APP_PATH }}
        run: cdk deploy gen-ai-proxy-service-DynamoDBStack --require-approval never

      # Must deploy before FlyioIamStack, which imports the bucket ARN
      - name: Deploy S3 stack
        working-directory: ${{ env.CDK_APP_PATH }}
        run: cdk deploy gen-ai-proxy-service-S3Stack --require-approval never

      - name: Deploy FlyioIamStack
        working-directory: ${{ env.CDK_APP_PATH }}
        run: cdk deploy gen-ai-proxy-service-FlyioIamStack --require-approval never

      - name: Set up Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Retrieval Server to Fly.io
        working-directory: retrieval-server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_NAME="genai-retrieval-server-${{ env.STAGE }}"
          
          # Fetch AWS credentials from CDK outputs (now required since retrieval-server queries DynamoDB)
          FLY_AWS_ACCESS_KEY_ID=$(aws cloudformation describe-stacks --stack-name gen-ai-proxy-service-FlyioIamStack --query "Stacks[0].Outputs[?OutputKey=='FlyioAwsAccessKeyId'].OutputValue" --output text)
          FLY_AWS_SECRET_ACCESS_KEY=$(aws cloudformation describe-stacks --stack-name gen-ai-proxy-service-FlyioIamStack --query "Stacks[0].Outputs[?OutputKey=='FlyioAwsSecretAccessKey'].OutputValue" --output text)
          ATTACHMENTS_BUCKET=$(aws cloudformation describe-stacks --stack-name gen-ai-proxy-service-S3Stack --query "Stacks[0].Outputs[?OutputKey=='AttachmentsBucketName'].OutputValue" --output text)

          # Set secrets and deploy
          flyctl secrets set --app $APP_NAME AWS_ACCESS_KEY_ID=$FLY_AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY=$FLY_AWS_SECRET_ACCESS_KEY AWS_REGION=${{ env.AWS_REGION }} ATTACHMENTS_BUCKET=$ATTACHMENTS_BUCKET

          # Supabase Postgres for durable agent runs (DBOS + LangGraph checkpointer;
          # see retrieval-server/DURABLE_AGENTS_DBOS_PLAN.md), from the
          # environment-scoped SUPABASE_URL secret: the SESSION-pooler connection
          # string (postgresql://…:5432/postgres?sslmode=require), not the https
          # project URL and not the transaction pooler (6543). The server reads it
          # as DATABASE_URL. Inert if unset: the server starts and durable /runs
          # stays inactive.
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            flyctl secrets set --app $APP_NAME --stage DATABASE_URL="${{ secrets.SUPABASE_URL }}"
          fi

          # --no-cache: an unpinned dependency (genflowly-encoding-library>=X)
          # resolves differently over time on PyPI, but Fly's remote builder
          # caches Docker layers by file content hash — a requirements.txt
          # that hasn't changed text can silently reuse a pip-install layer
          # resolved against a now-stale PyPI snapshot (2026-10-25 prod
          # outage: a crash-looping image shipped with an old library wheel).
          # Always rebuild from scratch so this class of staleness can't recur.
          flyctl deploy --app $APP_NAME --no-cache --yes

      - name: Deploy Proxy Server to Fly.io
        working-directory: ${{ env.SERVICE_APP_PATH }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_NAME="genai-proxy-server-${{ env.STAGE }}"
          RETRIEVAL_APP="genai-retrieval-server-${{ env.STAGE }}"
          
          # Fetch AWS credentials and KMS key from CDK outputs using distinct variable names
          FLY_AWS_ACCESS_KEY_ID=$(aws cloudformation describe-stacks --stack-name gen-ai-proxy-service-FlyioIamStack --query "Stacks[0].Outputs[?OutputKey=='FlyioAwsAccessKeyId'].OutputValue" --output text)
          FLY_AWS_SECRET_ACCESS_KEY=$(aws cloudformation describe-stacks --stack-name gen-ai-proxy-service-FlyioIamStack --query "Stacks[0].Outputs[?OutputKey=='FlyioAwsSecretAccessKey'].OutputValue" --output text)
          KMS_KEY_ID=$(aws cloudformation describe-stacks --stack-name gen-ai-proxy-service-KmsStack --query "Stacks[0].Outputs[?OutputKey=='KmsKeyArnOutput'].OutputValue" --output text)
          # The API URL is a plain stack output (no CloudFormation export), so it
          # must come from describe-stacks — list-exports returned empty, which
          # silently disabled all proxy->encoding-server ingestion.
          ENCODING_SERVER_URL=$(aws cloudformation describe-stacks --stack-name encoding-service-ApiGatewayStack --query "Stacks[0].Outputs[?OutputKey=='encodingservice${{ env.STAGE }}apigwApiEndpoint'].OutputValue" --output text)
          if [ -z "$ENCODING_SERVER_URL" ] || [ "$ENCODING_SERVER_URL" = "None" ]; then
            echo "Failed to resolve ENCODING_SERVER_URL from encoding-service-ApiGatewayStack outputs" >&2
            exit 1
          fi
          ATTACHMENTS_BUCKET=$(aws cloudformation describe-stacks --stack-name gen-ai-proxy-service-S3Stack --query "Stacks[0].Outputs[?OutputKey=='AttachmentsBucketName'].OutputValue" --output text)

          # Set secrets and deploy
          # Content reports are emailed through the support topic, named per stage by SupportStack.
          SUPPORT_TOPIC_ARN="arn:aws:sns:${{ env.AWS_REGION }}:$(aws sts get-caller-identity --query Account --output text):gen-ai-proxy-service-${{ env.STAGE }}-support-requests"

          flyctl secrets set --app $APP_NAME AWS_ACCESS_KEY_ID=$FLY_AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY=$FLY_AWS_SECRET_ACCESS_KEY AWS_REGION=${{ env.AWS_REGION }} KMS_KEY_ID=$KMS_KEY_ID SUPPORT_TOPIC_ARN="$SUPPORT_TOPIC_ARN" AUTH0_SPA_DOMAIN=${{ env.AUTH0_SPA_DOMAIN }} AUTH0_API_AUDIENCE=${{ env.AUTH0_API_AUDIENCE }} RETRIEVAL_SERVER_URL="http://${RETRIEVAL_APP}.flycast" ENCODING_SERVER_URL=$ENCODING_SERVER_URL ATTACHMENTS_BUCKET=$ATTACHMENTS_BUCKET ADMIN_EMAILS="${{ env.ADMIN_EMAILS }}" AUTH0_REACT_APP_CLIENT_IDS="${{ env.AUTH0_REACT_APP_CLIENT_IDS }}" AUTH0_ADMIN_PANEL_CLIENT_IDS="${{ env.AUTH0_ADMIN_PANEL_CLIENT_IDS }}"

          # Auth0 Management API credentials (a machine-to-machine app granted
          # delete:users), so account deletion also removes the Auth0 login.
          # AUTH0_MGMT_DOMAIN is the tenant's canonical domain. Inert if unset:
          # the login survives deletion and the job records a warning.
          if [ -n "${{ secrets.AUTH0_MGMT_CLIENT_SECRET }}" ]; then
            flyctl secrets set --app $APP_NAME --stage AUTH0_MGMT_DOMAIN="${{ secrets.AUTH0_MGMT_DOMAIN }}" AUTH0_MGMT_CLIENT_ID="${{ secrets.AUTH0_MGMT_CLIENT_ID }}" AUTH0_MGMT_CLIENT_SECRET="${{ secrets.AUTH0_MGMT_CLIENT_SECRET }}"
          fi

          flyctl deploy --app $APP_NAME --yes
