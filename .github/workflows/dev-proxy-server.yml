name: Development Proxy Server

# Deploys the proxy server (AWS/CDK) and the retrieval server (Fly.io).
# Self-triggered: runs only when these services (or this workflow) change.
on:
  push:
    branches: [development]
    paths:
      - 'genai-proxy-server/**'
      - 'genai-proxy-server-cdk/**'
      - 'retrieval-server/**'
      - '.github/workflows/dev-proxy-server.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CDK_APP_PATH: genai-proxy-server-cdk
  SERVICE_APP_PATH: genai-proxy-server
  AUTH0_SPA_DOMAIN: ${{ secrets.AUTH0_SPA_DOMAIN }}
  AUTH0_SPA_CLIENT_ID: ${{ secrets.AUTH0_SPA_CLIENT_ID }}
  AUTH0_API_AUDIENCE: ${{ secrets.AUTH0_API_AUDIENCE }}
  ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
  AUTH0_REACT_APP_CLIENT_IDS: ${{ secrets.AUTH0_REACT_APP_CLIENT_IDS }}
  AUTH0_ADMIN_PANEL_CLIENT_IDS: ${{ secrets.AUTH0_ADMIN_PANEL_CLIENT_IDS }}
  STAGE: development

jobs:
  deploy:
    name: Beta
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .npmrc file
        working-directory: ${{ env.CDK_APP_PATH }}
        run: |
          echo "@genflowly:registry=https://npm.pkg.github.com/" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}" >> .npmrc

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install dependencies
        working-directory: ${{ env.CDK_APP_PATH }}
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}

      - name: Deploy KMS stack
        working-directory: ${{ env.CDK_APP_PATH }}
        run: cdk deploy gen-ai-proxy-service-KmsStack --require-approval never

      - name: Deploy DynamoDB stack
        working-directory: ${{ env.CDK_APP_PATH }}
        run: cdk deploy gen-ai-proxy-service-DynamoDBStack --require-approval never

      # Must deploy before FlyioIamStack, which imports the bucket ARN
      - name: Deploy S3 stack
        working-directory: ${{ env.CDK_APP_PATH }}
        run: cdk deploy gen-ai-proxy-service-S3Stack --require-approval never

      - name: Deploy FlyioIamStack
        working-directory: ${{ env.CDK_APP_PATH }}
        run: cdk deploy gen-ai-proxy-service-FlyioIamStack --require-approval never

      - name: Set up Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Retrieval Server to Fly.io
        working-directory: retrieval-server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_NAME="genai-retrieval-server-${{ env.STAGE }}"
          
          # Fetch AWS credentials from CDK outputs (now required since retrieval-server queries DynamoDB)
          FLY_AWS_ACCESS_KEY_ID=$(aws cloudformation describe-stacks --stack-name gen-ai-proxy-service-FlyioIamStack --query "Stacks[0].Outputs[?OutputKey=='FlyioAwsAccessKeyId'].OutputValue" --output text)
          FLY_AWS_SECRET_ACCESS_KEY=$(aws cloudformation describe-stacks --stack-name gen-ai-proxy-service-FlyioIamStack --query "Stacks[0].Outputs[?OutputKey=='FlyioAwsSecretAccessKey'].OutputValue" --output text)
          ATTACHMENTS_BUCKET=$(aws cloudformation describe-stacks --stack-name gen-ai-proxy-service-S3Stack --query "Stacks[0].Outputs[?OutputKey=='AttachmentsBucketName'].OutputValue" --output text)

          # Set secrets and deploy
          flyctl secrets set --app $APP_NAME AWS_ACCESS_KEY_ID=$FLY_AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY=$FLY_AWS_SECRET_ACCESS_KEY AWS_REGION=${{ env.AWS_REGION }} ATTACHMENTS_BUCKET=$ATTACHMENTS_BUCKET

          # API key for hosted embedding providers (voyage model type); staged so the deploy below picks it up
          if [ -n "${{ secrets.VOYAGE_API_KEY }}" ]; then
            flyctl secrets set --app $APP_NAME --stage VOYAGE_API_KEY="${{ secrets.VOYAGE_API_KEY }}"
          fi

          # Tavily key for the WEB_SEARCH graph node; staged so the deploy below picks it up
          if [ -n "${{ secrets.TAVILY_API_KEY }}" ]; then
            flyctl secrets set --app $APP_NAME --stage TAVILY_API_KEY="${{ secrets.TAVILY_API_KEY }}"
          fi

          flyctl deploy --app $APP_NAME --yes

      - name: Deploy Proxy Server to Fly.io
        working-directory: ${{ env.SERVICE_APP_PATH }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_NAME="genai-proxy-server-${{ env.STAGE }}"
          RETRIEVAL_APP="genai-retrieval-server-${{ env.STAGE }}"
          
          # Fetch AWS credentials and KMS key from CDK outputs using distinct variable names
          FLY_AWS_ACCESS_KEY_ID=$(aws cloudformation describe-stacks --stack-name gen-ai-proxy-service-FlyioIamStack --query "Stacks[0].Outputs[?OutputKey=='FlyioAwsAccessKeyId'].OutputValue" --output text)
          FLY_AWS_SECRET_ACCESS_KEY=$(aws cloudformation describe-stacks --stack-name gen-ai-proxy-service-FlyioIamStack --query "Stacks[0].Outputs[?OutputKey=='FlyioAwsSecretAccessKey'].OutputValue" --output text)
          KMS_KEY_ID=$(aws cloudformation describe-stacks --stack-name gen-ai-proxy-service-KmsStack --query "Stacks[0].Outputs[?OutputKey=='KmsKeyArnOutput'].OutputValue" --output text)
          # The API URL is a plain stack output (no CloudFormation export), so it
          # must come from describe-stacks — list-exports returned empty, which
          # silently disabled all proxy->encoding-server ingestion.
          ENCODING_SERVER_URL=$(aws cloudformation describe-stacks --stack-name encoding-service-ApiGatewayStack --query "Stacks[0].Outputs[?OutputKey=='encodingservice${{ env.STAGE }}apigwApiEndpoint'].OutputValue" --output text)
          if [ -z "$ENCODING_SERVER_URL" ] || [ "$ENCODING_SERVER_URL" = "None" ]; then
            echo "Failed to resolve ENCODING_SERVER_URL from encoding-service-ApiGatewayStack outputs" >&2
            exit 1
          fi
          ATTACHMENTS_BUCKET=$(aws cloudformation describe-stacks --stack-name gen-ai-proxy-service-S3Stack --query "Stacks[0].Outputs[?OutputKey=='AttachmentsBucketName'].OutputValue" --output text)

          # Set secrets and deploy
          flyctl secrets set --app $APP_NAME AWS_ACCESS_KEY_ID=$FLY_AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY=$FLY_AWS_SECRET_ACCESS_KEY AWS_REGION=${{ env.AWS_REGION }} KMS_KEY_ID=$KMS_KEY_ID AUTH0_SPA_DOMAIN=${{ env.AUTH0_SPA_DOMAIN }} AUTH0_SPA_CLIENT_ID=${{ env.AUTH0_SPA_CLIENT_ID }} AUTH0_API_AUDIENCE=${{ env.AUTH0_API_AUDIENCE }} RETRIEVAL_SERVER_URL="http://${RETRIEVAL_APP}.flycast" ENCODING_SERVER_URL=$ENCODING_SERVER_URL ATTACHMENTS_BUCKET=$ATTACHMENTS_BUCKET ADMIN_EMAILS="${{ env.ADMIN_EMAILS }}" AUTH0_REACT_APP_CLIENT_IDS="${{ env.AUTH0_REACT_APP_CLIENT_IDS }}" AUTH0_ADMIN_PANEL_CLIENT_IDS="${{ env.AUTH0_ADMIN_PANEL_CLIENT_IDS }}"

          flyctl deploy --app $APP_NAME --yes


