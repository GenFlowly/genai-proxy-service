name: Production Workers Deploy

# Manual-only: deploys the router workers that sit in front of the
# production domains (react app + admin panel). Deploy from the Actions
# tab (always builds main).
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy router workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 deploy --config cloudflare/router-worker/react-app.toml --env production
          npx wrangler@4 deploy --config cloudflare/router-worker/admin-panel.toml --env production
