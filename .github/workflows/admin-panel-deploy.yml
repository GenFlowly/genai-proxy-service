name: Development Admin Panel Deploy

on:
  workflow_call:
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: false
      NETLIFY_ADMIN_PANEL_SITE_ID:
        required: false
      AUTH0_SPA_DOMAIN:
        required: false
      AUTH0_ADMIN_PANEL_CLIENT_ID:
        required: false
      AUTH0_API_AUDIENCE:
        required: false
  workflow_dispatch:

jobs:
  deploy:
    name: Beta
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .npmrc file
        working-directory: admin-panel
        run: |
          echo "@genflowly:registry=https://npm.pkg.github.com/" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}" >> .npmrc

      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_ADMIN_PANEL_SITE_ID }}
          VITE_AUTH0_DOMAIN: ${{ secrets.AUTH0_SPA_DOMAIN }}
          # The admin panel's own Auth0 application — NOT the react-app clientId.
          # The backend maps this azp to the ADMIN_PANEL account (see admin-panel/README.md).
          VITE_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_ADMIN_PANEL_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.AUTH0_API_AUDIENCE }}
          VITE_BACKEND_URL: "https://api-development.genflowly.com"
        working-directory: admin-panel
        run: |
          npm ci
          npm run build
          npx netlify-cli deploy --prod --dir=dist --site=$NETLIFY_SITE_ID
