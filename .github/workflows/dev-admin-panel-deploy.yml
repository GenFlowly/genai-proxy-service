name: Development Admin Panel Deploy

# Self-triggered: runs only when the admin panel (or this workflow) changes.
on:
  push:
    branches: [development]
    paths:
      - 'admin-panel/**'
      - '.github/workflows/dev-admin-panel-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Beta
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .npmrc file
        working-directory: admin-panel
        run: |
          echo "@genflowly:registry=https://npm.pkg.github.com/" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}" >> .npmrc

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_AUTH0_DOMAIN: ${{ secrets.AUTH0_SPA_DOMAIN }}
          # The admin panel's own Auth0 application — NOT the react-app clientId.
          # The backend maps this azp to the ADMIN_PANEL account (see admin-panel/README.md).
          VITE_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_ADMIN_PANEL_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.AUTH0_API_AUDIENCE }}
          VITE_BACKEND_URL: "https://api-development.genflowly.com"
        working-directory: admin-panel
        run: |
          npm ci
          npm run build
          # wrangler must stay pinned to v3: in v4 the `pages` commands deploy
          # to Workers instead of the classic Pages project.
          npx wrangler@3 pages deploy dist --project-name=genflowly-admin-panel --branch=development --commit-dirty=true
