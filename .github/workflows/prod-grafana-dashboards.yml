name: Production Grafana Dashboards

# Deploys the production Grafana dashboards (dashboards-as-code).
# The JSONs in observability/grafana/ are the source of truth; this
# workflow upserts them into Grafana Cloud by uid on every merge to main
# that touches them.
# Self-triggered: runs only when the dashboards (or this workflow) change.
on:
  push:
    branches: [main]
    paths:
      - 'observability/grafana/*-production.json'
      - 'observability/grafana/datasources/*-production.json'
      - 'observability/grafana/alerts/*-production.json'
      - '.github/workflows/prod-grafana-dashboards.yml'
  workflow_dispatch:

env:
  STAGE: production

jobs:
  deploy:
    name: Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy dashboards to Grafana
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_SA_TOKEN: ${{ secrets.GRAFANA_SA_TOKEN }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $GRAFANA_SA_TOKEN" -H "Content-Type: application/json")
          folder_uid="genflowly-$STAGE"

          # Ensure the stage folder exists (409/412 = already there)
          code=$(curl -s -o /tmp/folder.json -w '%{http_code}' -X POST "$GRAFANA_URL/api/folders" \
            "${auth[@]}" -d "{\"uid\": \"$folder_uid\", \"title\": \"GenFlowly ($STAGE)\"}")
          if [[ "$code" != "200" && "$code" != "409" && "$code" != "412" ]]; then
            echo "Folder create failed ($code):"; cat /tmp/folder.json; exit 1
          fi

          # Datasources-as-code: upsert the CloudWatch datasources by uid so the
          # uids the dashboards pin survive a cold-start rebuild. Writing
          # datasources needs an Admin SA token (dashboards only need Editor), so
          # a 403 is a skip-with-warning — it must never block the deploy below.
          shopt -s nullglob
          for df in observability/grafana/datasources/*-"$STAGE".json; do
            uid=$(jq -r '.uid' "$df"); dsname=$(jq -r '.name' "$df")
            code=$(curl -s -o /tmp/ds_get.json -w '%{http_code}' "$GRAFANA_URL/api/datasources/uid/$uid" "${auth[@]}")
            case "$code" in
              200) method=PUT;  target="$GRAFANA_URL/api/datasources/uid/$uid" ;;
              404) method=POST; target="$GRAFANA_URL/api/datasources" ;;
              403) echo "WARNING: SA token lacks datasource access — skipping $dsname ($uid); upgrade the service account to Admin to manage datasources as code"; continue ;;
              *)   echo "Datasource lookup for $dsname failed ($code):"; cat /tmp/ds_get.json; exit 1 ;;
            esac
            code=$(curl -s -o /tmp/ds_resp.json -w '%{http_code}' -X "$method" "$target" "${auth[@]}" -d @"$df")
            if [[ "$code" == "403" ]]; then
              echo "WARNING: SA token lacks datasource:write — skipping $dsname ($uid); upgrade the service account to Admin"
            elif [[ "$code" != "200" ]]; then
              echo "Datasource upsert for $dsname failed ($code):"; cat /tmp/ds_resp.json; exit 1
            else
              echo "  -> datasource $dsname ($uid) upserted via $method"
            fi
          done

          for f in observability/grafana/*-"$STAGE".json; do
            echo "Deploying $f"
            jq -n --slurpfile dash "$f" --arg msg "deploy ${GITHUB_SHA::8}" --arg folder "$folder_uid" \
              '{dashboard: ($dash[0] | .id = null), folderUid: $folder, overwrite: true, message: $msg}' \
              > /tmp/payload.json
            code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST "$GRAFANA_URL/api/dashboards/db" \
              "${auth[@]}" -d @/tmp/payload.json)
            if [[ "$code" != "200" ]]; then
              echo "Deploy failed ($code):"; cat /tmp/resp.json; exit 1
            fi
            jq -r '"  -> \(.status) uid=\(.uid) \(.url)"' /tmp/resp.json
          done

          # Alert rules as code: observability/grafana/alerts/alerts-$STAGE.json
          # holds an array of Grafana provisioning alert rules with
          # __PROM_DS_UID__ as a datasource placeholder, resolved here against
          # the stack's Prometheus datasource. X-Disable-Provenance keeps the
          # rules editable in the UI between deploys; this upsert-by-uid wins
          # on the next run. Contact points / notification policies are NOT
          # managed here — rules fire into the default notification policy.
          alerts_file="observability/grafana/alerts/alerts-$STAGE.json"
          if [[ -f "$alerts_file" ]]; then
            prom_uid=$(curl -s "$GRAFANA_URL/api/datasources" "${auth[@]}" \
              | jq -r '[.[] | select(.type=="prometheus")] | (map(select(.isDefault)) + .) | first.uid // empty')
            if [[ -z "$prom_uid" ]]; then
              echo "WARNING: no Prometheus datasource visible to the SA token — skipping alert rules (token needs datasource read)"
            else
              echo "Deploying alert rules against Prometheus datasource $prom_uid"
              jq -c --arg ds "$prom_uid" '.[] | walk(if . == "__PROM_DS_UID__" then $ds else . end)' "$alerts_file" \
                | while IFS= read -r rule; do
                uid=$(jq -r '.uid' <<<"$rule")
                title=$(jq -r '.title' <<<"$rule")
                code=$(curl -s -o /tmp/ar_get.json -w '%{http_code}' \
                  "$GRAFANA_URL/api/v1/provisioning/alert-rules/$uid" "${auth[@]}")
                case "$code" in
                  200) method=PUT;  target="$GRAFANA_URL/api/v1/provisioning/alert-rules/$uid" ;;
                  404) method=POST; target="$GRAFANA_URL/api/v1/provisioning/alert-rules" ;;
                  *)   echo "Alert rule lookup for '$title' failed ($code):"; cat /tmp/ar_get.json; exit 1 ;;
                esac
                code=$(curl -s -o /tmp/ar_resp.json -w '%{http_code}' -X "$method" "$target" \
                  "${auth[@]}" -H "X-Disable-Provenance: true" -d "$rule")
                if [[ "$code" != "200" && "$code" != "201" ]]; then
                  echo "Alert rule upsert for '$title' failed ($code):"; cat /tmp/ar_resp.json; exit 1
                fi
                echo "  -> alert rule '$title' ($uid) upserted via $method"
              done
            fi
          fi
