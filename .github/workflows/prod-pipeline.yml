name: Production Pipeline

on:
  pull_request:
    branches: [main]
    types: [closed]
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CDK_APP_PATH: genai-proxy-server-cdk
  ENCODING_CDK_PATH: encoding-server-cdk
  SERVICE_APP_PATH: genai-proxy-server
  AUTH0_SPA_DOMAIN: ${{ secrets.AUTH0_SPA_DOMAIN }}
  AUTH0_SPA_CLIENT_ID: ${{ secrets.AUTH0_SPA_CLIENT_ID }}
  AUTH0_API_AUDIENCE: ${{ secrets.AUTH0_API_AUDIENCE }}

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  # Detect which services have changes
  detect-changes:
    name: Detect Deployment Targets
    runs-on: ubuntu-latest
    outputs:
      proxy-server: ${{ steps.filter.outputs.proxy-server }}
      encoding-server: ${{ steps.filter.outputs.encoding-server }}
      encoding-library: ${{ steps.filter.outputs.encoding-library }}
      react-app: ${{ steps.filter.outputs.react-app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            proxy-server:
              - 'genai-proxy-server/**'
              - 'genai-proxy-server-cdk/**'
              - 'retrieval-server/**'
              - '.github/workflows/prod-pipeline.yml'
              - '.github/workflows/prod-proxy-server.yml'
            encoding-server:
              - 'encoding-server/**'
              - 'encoding-server-cdk/**'
              - '.github/workflows/prod-pipeline.yml'
              - '.github/workflows/prod-encoding-server.yml'
            encoding-library:
              - 'encoding-library/**'
              - '.github/workflows/prod-pipeline.yml'
              - '.github/workflows/prod-publish-encoding-library.yml'
            react-app:
              - 'genai-react-app/**'
              - '.github/workflows/prod-pipeline.yml'
              - '.github/workflows/prod-react-app-deploy.yml'

  proxy-server-production:
    name: Proxy Service
    needs: detect-changes
    if: needs.detect-changes.outputs.proxy-server == 'true' && github.event_name == 'pull_request' && github.event.pull_request.merged == true
    uses: ./.github/workflows/prod-proxy-server.yml
    secrets: inherit

  encoding-server-production:
    name: Encoding Service
    needs: detect-changes
    if: needs.detect-changes.outputs.encoding-server == 'true' && github.event_name == 'pull_request' && github.event.pull_request.merged == true
    uses: ./.github/workflows/prod-encoding-server.yml
    secrets: inherit

  encoding-library-production:
    name: Encoding Library
    needs: detect-changes
    if: needs.detect-changes.outputs.encoding-library == 'true' && github.event_name == 'pull_request' && github.event.pull_request.merged == true
    uses: ./.github/workflows/prod-publish-encoding-library.yml
    secrets: inherit

  react-app-production:
    name: React App
    needs: detect-changes
    if: (needs.detect-changes.outputs.react-app == 'true' && github.event_name == 'workflow_dispatch') || github.event_name == 'schedule'
    uses: ./.github/workflows/prod-react-app-deploy.yml
    secrets: inherit
