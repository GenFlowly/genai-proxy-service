name: Proxy Server

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      GH_PAT_TOKEN_FOR_FREE_ACCOUNT:
        required: true
      AUTH0_SPA_DOMAIN:
        required: true
      AUTH0_SPA_CLIENT_ID:
        required: true
      AUTH0_API_AUDIENCE:
        required: true
      NETLIFY_AUTH_TOKEN:
        required: true
      NETLIFY_SITE_ID:
        required: true

env:
  AWS_REGION: us-east-1
  CDK_APP_PATH: genai-proxy-server-cdk
  SERVICE_APP_PATH: genai-proxy-server
  AUTH0_SPA_DOMAIN: ${{ secrets.AUTH0_SPA_DOMAIN }}
  AUTH0_SPA_CLIENT_ID: ${{ secrets.AUTH0_SPA_CLIENT_ID }}
  AUTH0_API_AUDIENCE: ${{ secrets.AUTH0_API_AUDIENCE }}

jobs:
  deploy:
    name: Beta
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .npmrc file
        working-directory: ${{ env.CDK_APP_PATH }}
        run: |
          echo "@genflowly:registry=https://npm.pkg.github.com/" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}" >> .npmrc

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install dependencies
        working-directory: ${{ env.CDK_APP_PATH }}
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}

      - name: Deploy ECR stack (CDK)
        working-directory: ${{ env.CDK_APP_PATH }}
        run: cdk deploy gen-ai-proxy-service-EcrStack --require-approval never

      - name: Get ECR Repository URIs
        id: get-ecr-uri
        run: |
          ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name gen-ai-proxy-service-EcrStack \
            --query "Stacks[0].Outputs[?OutputKey=='EcrRepositoryUri'].OutputValue" \
            --output text)
          echo "ECR_URI=$ECR_URI" >> $GITHUB_ENV
          echo "ECR_REPOSITORY_NAME=$(basename $ECR_URI)" >> $GITHUB_ENV
          echo "Using Proxy Service ECR URI: $ECR_URI"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build proxy service Docker image
        working-directory: ${{ env.SERVICE_APP_PATH }}
        run: |
          docker build -t $ECR_REPOSITORY_NAME .

      - name: Tag and push proxy service Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker tag $ECR_REPOSITORY_NAME:latest $ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy KMS stack
        working-directory: ${{ env.CDK_APP_PATH }}
        run: cdk deploy gen-ai-proxy-service-KmsStack --require-approval never

      - name: Deploy DynamoDB stack
        working-directory: ${{ env.CDK_APP_PATH }}
        run: cdk deploy gen-ai-proxy-service-DynamoDBStack --require-approval never

      - name: Deploy ECS stack
        working-directory: ${{ env.CDK_APP_PATH }}
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: cdk deploy gen-ai-proxy-service-EcsStack --require-approval never

      - name: Deploy React App to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        working-directory: genai-react-app
        run: |
          npm ci
          npm run build
          npx netlify-cli deploy --prod --dir=build
