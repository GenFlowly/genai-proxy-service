name: Production iOS TestFlight

# Runs on pushes to main that change the app under IOS App/ (Markdown files and Xcode's
# per-user xcuserdata don't count), and by hand from the Actions tab (or `gh workflow run`)
# with `main` selected; runs from any other branch are skipped. A change to this workflow
# alone starts nothing, so start a run by hand to try one.
# Runs the unit tests, uploads a signed production-stage build to TestFlight for internal
# testers and selects it on the App Store version draft. Nothing is submitted for review:
# that is done by hand in App Store Connect after testing the TestFlight build. Each run takes
# the next patch version above what App Store Connect has seen. The recipe and the credential
# names are in IOS App/fastlane/Fastfile.
on:
  push:
    branches: [main]
    paths:
      - 'IOS App/**'
      - '!IOS App/**/*.md'
      - '!IOS App/**/xcuserdata/**'
  workflow_dispatch:

# Versions and build numbers come from App Store Connect, so runs upload one at a time.
concurrency:
  group: ios-app-store-connect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: TestFlight
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    environment: production
    timeout-minutes: 90
    defaults:
      run:
        working-directory: IOS App
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      LANG: en_US.UTF-8
      FASTLANE_SKIP_UPDATE_CHECK: 1
      FASTLANE_HIDE_CHANGELOG: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: IOS App/SourcePackages
          key: spm-${{ hashFiles('IOS App/AI Wrapper.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Toolchain
        run: |
          xcodebuild -version
          fastlane --version | tail -1

      - name: Unit tests
        run: fastlane ios unit_tests stage:production

      - name: TestFlight and App Store draft
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_DISTRIBUTION_CERT_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_DISTRIBUTION_CERT_ID: ${{ secrets.IOS_DISTRIBUTION_CERT_ID }}
          IOS_AUTH0_CLIENT_ID: ${{ secrets.IOS_AUTH0_CLIENT_ID }}
          IOS_SENTRY_DSN: ${{ secrets.IOS_SENTRY_DSN }}
        run: fastlane ios release

      - name: Keep logs and test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-store-logs
          path: |
            IOS App/build/logs
            IOS App/build/tests
          if-no-files-found: ignore
