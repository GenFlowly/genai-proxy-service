name: Weekly React App Deploy

on:
  schedule:
    # Runs at 00:00 UTC every Friday
    - cron: '0 0 * * 5'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI
  workflow_call:
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: false
      NETLIFY_SITE_ID:
        required: false
      GH_PAT_TOKEN_FOR_FREE_ACCOUNT:
        required: false
      AUTH0_SPA_DOMAIN:
        required: false
      AUTH0_SPA_CLIENT_ID:
        required: false
      AUTH0_API_AUDIENCE:
        required: false

jobs:
  deploy:
    name: Beta
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .npmrc file
        working-directory: genai-react-app
        run: |
          echo "@genflowly:registry=https://npm.pkg.github.com/" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}" >> .npmrc

      - name: Beta
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          REACT_APP_AUTH0_DOMAIN: ${{ secrets.AUTH0_SPA_DOMAIN }}
          REACT_APP_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_SPA_CLIENT_ID }}
          REACT_APP_AUTH0_AUDIENCE: ${{ secrets.AUTH0_API_AUDIENCE }}
          REACT_APP_BACKEND_URL: "https://api-development.genflowly.com"
        working-directory: genai-react-app
        run: |
          npm install
          npm run build
          npx netlify-cli deploy --prod --dir=build --site=$NETLIFY_SITE_ID

