name: Development React App Deploy

# Self-triggered: runs only when the react app (or this workflow) changes.
on:
  push:
    branches: [development]
    paths:
      - 'genai-react-app/**'
      - '.github/workflows/dev-react-app-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Beta
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .npmrc file
        working-directory: genai-react-app
        run: |
          echo "@genflowly:registry=https://npm.pkg.github.com/" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}" >> .npmrc

      - name: Beta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REACT_APP_AUTH0_DOMAIN: ${{ secrets.AUTH0_SPA_DOMAIN }}
          REACT_APP_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_SPA_CLIENT_ID }}
          REACT_APP_AUTH0_AUDIENCE: ${{ secrets.AUTH0_API_AUDIENCE }}
          REACT_APP_BACKEND_URL: "https://api-development.genflowly.com"
        working-directory: genai-react-app
        run: |
          npm install
          npm run build
          # wrangler must stay pinned to v3: in v4 the `pages` commands deploy
          # to Workers instead of the classic Pages project.
          npx wrangler@3 pages deploy build --project-name=genflowly-react-app --branch=development --commit-dirty=true

