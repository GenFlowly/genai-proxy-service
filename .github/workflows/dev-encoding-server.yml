name: Development Encoding Server

# Deploys the encoding server images + CDK stacks.
# Self-triggered: runs only when the encoding service (or this workflow) changes.
on:
  push:
    branches: [development]
    paths:
      - 'encoding-server/**'
      - 'encoding-server-cdk/**'
      - '.github/workflows/dev-encoding-server.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENCODING_CDK_PATH: encoding-server-cdk
  AUTH0_SPA_DOMAIN: ${{ secrets.AUTH0_SPA_DOMAIN }}
  ZILLIZ_ENDPOINT: ${{ secrets.ZILLIZ_ENDPOINT }}
  ZILLIZ_TOKEN: ${{ secrets.ZILLIZ_TOKEN }}
  STAGE: development

jobs:
  deploy:
    name: Beta
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Unit tests before any image or stack is deployed (plan 1.1); the
      # vector store is faked, so they need no AWS access or network.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: encoding-server/requirements.txt

      - name: Test encoding server
        working-directory: encoding-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest discover -s tests -t . -v

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .npmrc file
        working-directory: ${{ env.ENCODING_CDK_PATH }}
        run: |
          echo "@genflowly:registry=https://npm.pkg.github.com/" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}" >> .npmrc

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install dependencies
        working-directory: ${{ env.ENCODING_CDK_PATH }}
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}


      - name: Deploy ECR stack first to create repositories
        working-directory: ${{ env.ENCODING_CDK_PATH }}
        run: |
          echo "Deploying ECR stack to create repositories..."
          cdk deploy encoding-service-EcrStack --require-approval never
        env:
          # Dummy values to satisfy bin/cdk.ts validation during ECR stack deployment
          INGESTION_IMAGE_TAG: "placeholder"
          PARSE_AND_CHUNK_IMAGE_TAG: "placeholder"
          CREATE_EMBEDDINGS_IMAGE_TAG: "placeholder"
          STORE_EMBEDDINGS_IMAGE_TAG: "placeholder"
          CREATE_COLLECTIONS_IMAGE_TAG: "placeholder"

      - name: Get ECR Repository URIs
        id: get-ecr-uri
        run: |
          INGESTION_ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name encoding-service-EcrStack \
            --query "Stacks[0].Outputs[?OutputKey=='IngestionRepoUri'].OutputValue" \
            --output text)
          echo "INGESTION_ECR_URI=$INGESTION_ECR_URI" >> $GITHUB_ENV
          echo "INGESTION_ECR_REPO=$(basename $INGESTION_ECR_URI)" >> $GITHUB_ENV
          echo "Using Ingestion Lambda ECR: $INGESTION_ECR_URI"
          
          PARSE_AND_CHUNK_ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name encoding-service-EcrStack \
            --query "Stacks[0].Outputs[?OutputKey=='ParseAndChunkRepoUri'].OutputValue" \
            --output text)
          echo "PARSE_AND_CHUNK_ECR_URI=$PARSE_AND_CHUNK_ECR_URI" >> $GITHUB_ENV
          echo "PARSE_AND_CHUNK_ECR_REPO=$(basename $PARSE_AND_CHUNK_ECR_URI)" >> $GITHUB_ENV
          echo "Using Parse and Chunk Lambda ECR: $PARSE_AND_CHUNK_ECR_URI"
          
          CREATE_EMBEDDINGS_ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name encoding-service-EcrStack \
            --query "Stacks[0].Outputs[?OutputKey=='CreateEmbeddingsRepoUri'].OutputValue" \
            --output text)
          echo "CREATE_EMBEDDINGS_ECR_URI=$CREATE_EMBEDDINGS_ECR_URI" >> $GITHUB_ENV
          echo "CREATE_EMBEDDINGS_ECR_REPO=$(basename $CREATE_EMBEDDINGS_ECR_URI)" >> $GITHUB_ENV
          echo "Using Create Embeddings Lambda ECR: $CREATE_EMBEDDINGS_ECR_URI"

          STORE_EMBEDDINGS_ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name encoding-service-EcrStack \
            --query "Stacks[0].Outputs[?OutputKey=='StoreEmbeddingsRepoUri'].OutputValue" \
            --output text)
          echo "STORE_EMBEDDINGS_ECR_URI=$STORE_EMBEDDINGS_ECR_URI" >> $GITHUB_ENV
          echo "STORE_EMBEDDINGS_ECR_REPO=$(basename $STORE_EMBEDDINGS_ECR_URI)" >> $GITHUB_ENV
          echo "Using Store Embeddings Lambda ECR: $STORE_EMBEDDINGS_ECR_URI"

          CREATE_COLLECTIONS_ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name encoding-service-EcrStack \
            --query "Stacks[0].Outputs[?OutputKey=='CreateCollectionsRepoUri'].OutputValue" \
            --output text)
          echo "CREATE_COLLECTIONS_ECR_URI=$CREATE_COLLECTIONS_ECR_URI" >> $GITHUB_ENV
          echo "CREATE_COLLECTIONS_ECR_REPO=$(basename $CREATE_COLLECTIONS_ECR_URI)" >> $GITHUB_ENV
          echo "Using Create Collections Lambda ECR: $CREATE_COLLECTIONS_ECR_URI"


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Free up disk space before building
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build ingestion Lambda Docker image
        working-directory: encoding-server
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -f Dockerfile.ingestion -t ingestion-lambda:$IMAGE_TAG .
          docker tag ingestion-lambda:$IMAGE_TAG $ECR_REGISTRY/$INGESTION_ECR_REPO:ingestion-$IMAGE_TAG
          docker tag ingestion-lambda:$IMAGE_TAG $ECR_REGISTRY/$INGESTION_ECR_REPO:ingestion-latest
          echo "INGESTION_IMAGE_URI=$ECR_REGISTRY/$INGESTION_ECR_REPO:ingestion-$IMAGE_TAG" >> $GITHUB_ENV
          echo "INGESTION_IMAGE_TAG=ingestion-$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push ingestion Lambda Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $INGESTION_IMAGE_URI
          docker push $ECR_REGISTRY/$INGESTION_ECR_REPO:ingestion-latest
          echo "Pushed ingestion Lambda: $INGESTION_IMAGE_URI and ingestion-latest"
          docker rmi $INGESTION_IMAGE_URI
          docker rmi $ECR_REGISTRY/$INGESTION_ECR_REPO:ingestion-latest
          docker rmi ingestion-lambda:${GITHUB_SHA::7}
          docker system prune -f

      - name: Build Parse And Chunk Lambda Docker image
        working-directory: encoding-server
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -f Dockerfile.parse_and_chunk -t parse-and-chunk-lambda:$IMAGE_TAG .
          docker tag parse-and-chunk-lambda:$IMAGE_TAG $ECR_REGISTRY/$PARSE_AND_CHUNK_ECR_REPO:parse-and-chunk-$IMAGE_TAG
          docker tag parse-and-chunk-lambda:$IMAGE_TAG $ECR_REGISTRY/$PARSE_AND_CHUNK_ECR_REPO:parse-and-chunk-latest
          echo "PARSE_AND_CHUNK_IMAGE_URI=$ECR_REGISTRY/$PARSE_AND_CHUNK_ECR_REPO:parse-and-chunk-$IMAGE_TAG" >> $GITHUB_ENV
          echo "PARSE_AND_CHUNK_IMAGE_TAG=parse-and-chunk-$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Parse And Chunk Lambda Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $PARSE_AND_CHUNK_IMAGE_URI
          docker push $ECR_REGISTRY/$PARSE_AND_CHUNK_ECR_REPO:parse-and-chunk-latest
          echo "Pushed Parse And Chunk Lambda: $PARSE_AND_CHUNK_IMAGE_URI and parse-and-chunk-latest"
          docker rmi $PARSE_AND_CHUNK_IMAGE_URI
          docker rmi $ECR_REGISTRY/$PARSE_AND_CHUNK_ECR_REPO:parse-and-chunk-latest
          docker rmi parse-and-chunk-lambda:${GITHUB_SHA::7}
          docker system prune -f

      - name: Build Create Embeddings Lambda Docker image
        working-directory: encoding-server
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -f Dockerfile.create_embeddings -t create-embeddings-lambda:$IMAGE_TAG .
          docker tag create-embeddings-lambda:$IMAGE_TAG $ECR_REGISTRY/$CREATE_EMBEDDINGS_ECR_REPO:create-embeddings-$IMAGE_TAG
          docker tag create-embeddings-lambda:$IMAGE_TAG $ECR_REGISTRY/$CREATE_EMBEDDINGS_ECR_REPO:create-embeddings-latest
          echo "CREATE_EMBEDDINGS_IMAGE_URI=$ECR_REGISTRY/$CREATE_EMBEDDINGS_ECR_REPO:create-embeddings-$IMAGE_TAG" >> $GITHUB_ENV
          echo "CREATE_EMBEDDINGS_IMAGE_TAG=create-embeddings-$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Create Embeddings Lambda Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $CREATE_EMBEDDINGS_IMAGE_URI
          docker push $ECR_REGISTRY/$CREATE_EMBEDDINGS_ECR_REPO:create-embeddings-latest
          echo "Pushed Create Embeddings Lambda: $CREATE_EMBEDDINGS_IMAGE_URI and create-embeddings-latest"
          docker rmi $CREATE_EMBEDDINGS_IMAGE_URI
          docker rmi $ECR_REGISTRY/$CREATE_EMBEDDINGS_ECR_REPO:create-embeddings-latest
          docker rmi create-embeddings-lambda:${GITHUB_SHA::7}
          docker system prune -f

      - name: Build Zilliz Base Docker image
        working-directory: encoding-server
        run: |
          docker build -f Dockerfile.milvus_base -t milvus-base:latest .

      - name: Build Store Embeddings Lambda Docker image
        working-directory: encoding-server
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -f Dockerfile.store_embeddings -t store-embeddings-lambda:$IMAGE_TAG .
          docker tag store-embeddings-lambda:$IMAGE_TAG $ECR_REGISTRY/$STORE_EMBEDDINGS_ECR_REPO:store-embeddings-$IMAGE_TAG
          docker tag store-embeddings-lambda:$IMAGE_TAG $ECR_REGISTRY/$STORE_EMBEDDINGS_ECR_REPO:store-embeddings-latest
          echo "STORE_EMBEDDINGS_IMAGE_URI=$ECR_REGISTRY/$STORE_EMBEDDINGS_ECR_REPO:store-embeddings-$IMAGE_TAG" >> $GITHUB_ENV
          echo "STORE_EMBEDDINGS_IMAGE_TAG=store-embeddings-$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Store Embeddings Lambda Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $STORE_EMBEDDINGS_IMAGE_URI
          docker push $ECR_REGISTRY/$STORE_EMBEDDINGS_ECR_REPO:store-embeddings-latest
          echo "Pushed Store Embeddings Lambda: $STORE_EMBEDDINGS_IMAGE_URI and store-embeddings-latest"
          docker rmi $STORE_EMBEDDINGS_IMAGE_URI
          docker rmi $ECR_REGISTRY/$STORE_EMBEDDINGS_ECR_REPO:store-embeddings-latest
          docker rmi store-embeddings-lambda:${GITHUB_SHA::7}
          docker system prune -f

      - name: Build Create Collections Lambda Docker image
        working-directory: encoding-server
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -f Dockerfile.create_collections -t create-collections-lambda:$IMAGE_TAG .
          docker tag create-collections-lambda:$IMAGE_TAG $ECR_REGISTRY/$CREATE_COLLECTIONS_ECR_REPO:create-collections-$IMAGE_TAG
          docker tag create-collections-lambda:$IMAGE_TAG $ECR_REGISTRY/$CREATE_COLLECTIONS_ECR_REPO:create-collections-latest
          echo "CREATE_COLLECTIONS_IMAGE_URI=$ECR_REGISTRY/$CREATE_COLLECTIONS_ECR_REPO:create-collections-$IMAGE_TAG" >> $GITHUB_ENV
          echo "CREATE_COLLECTIONS_IMAGE_TAG=create-collections-$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Create Collections Lambda Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $CREATE_COLLECTIONS_IMAGE_URI
          docker push $ECR_REGISTRY/$CREATE_COLLECTIONS_ECR_REPO:create-collections-latest
          echo "Pushed Create Collections Lambda: $CREATE_COLLECTIONS_IMAGE_URI and create-collections-latest"
          docker rmi $CREATE_COLLECTIONS_IMAGE_URI
          docker rmi $ECR_REGISTRY/$CREATE_COLLECTIONS_ECR_REPO:create-collections-latest
          docker rmi create-collections-lambda:${GITHUB_SHA::7}
          docker system prune -f

      - name: Deploy S3Stack, SqsStack, LambdaStack, StepFunctionsV2Stack, ApiGatewayStack
        working-directory: ${{ env.ENCODING_CDK_PATH }}
        env:
          INGESTION_IMAGE_TAG: ${{ env.INGESTION_IMAGE_TAG }}
          PARSE_AND_CHUNK_IMAGE_TAG: ${{ env.PARSE_AND_CHUNK_IMAGE_TAG }}
          CREATE_EMBEDDINGS_IMAGE_TAG: ${{ env.CREATE_EMBEDDINGS_IMAGE_TAG }}
          STORE_EMBEDDINGS_IMAGE_TAG: ${{ env.STORE_EMBEDDINGS_IMAGE_TAG }}
          CREATE_COLLECTIONS_IMAGE_TAG: ${{ env.CREATE_COLLECTIONS_IMAGE_TAG }}
          AUTH0_SPA_DOMAIN: ${{ env.AUTH0_SPA_DOMAIN }}
          ZILLIZ_ENDPOINT: ${{ secrets.ZILLIZ_ENDPOINT }}
          ZILLIZ_TOKEN: ${{ secrets.ZILLIZ_TOKEN }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          # Passed by the CDK app (bin/cdk.ts) into the purge-vectors Lambda's
          # environment. POST /purge-vectors deletes a customer's or a conversation's
          # vectors when the proxy purges a deleted account or conversation (PDF plan
          # 3.9). The Lambda accepts only Auth0 client-credentials tokens whose client
          # id is in this comma-separated list (the proxy's machine-to-machine app);
          # user tokens get 403, and while the secret is unset every call gets 403.
          PURGE_ALLOWED_CLIENT_IDS: ${{ secrets.PURGE_ALLOWED_CLIENT_IDS }}
          CUSTOMER_PROFILE_TABLE_NAME: "CustomerProfile"
        run: cdk deploy encoding-service-S3Stack encoding-service-SqsStack encoding-service-LambdaStack encoding-service-StepFunctionsV2Stack encoding-service-ApiGatewayStack --require-approval never
