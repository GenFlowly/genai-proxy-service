name: Upload Python Package

on:
  workflow_call:
    secrets:
      PYPI_API_TOKEN:
        required: true
  push:
    branches: [ "development" ]
    paths:
      - 'encoding-library/**'
  pull_request:
    branches: [ "development" ]
    paths:
      - 'encoding-library/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: encoding-library
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          pip install -e .[dev]
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        run: |
          # Create dummy test script if it doesn't exist so pytest doesn't fail with exit code 5
          mkdir -p tests
          touch tests/__init__.py
          if [ ! -f tests/test_dummy.py ]; then echo "def test_dummy(): pass" > tests/test_dummy.py; fi
          pytest

  publish:
    name: Prod
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: encoding-library
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -e .
      - name: Build package
        run: |
          rm -rf dist/
          python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages_dir: encoding-library/dist/
