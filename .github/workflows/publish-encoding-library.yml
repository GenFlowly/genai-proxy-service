name: Encoding Library Publish

# Single publisher for genflowly-encoding-library (one PyPI account, no
# per-environment split). Any branch push touching the library builds, tests,
# and publishes; skip_existing makes re-pushes of an already-published version
# (e.g. the fast-forward to main) a no-op instead of a duplicate-upload error.
on:
  push:
    paths:
      - 'encoding-library/**'
      - '.github/workflows/publish-encoding-library.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: encoding-library
    strategy:
      fail-fast: false
      matrix:
        # 3.9/3.10 are EOL and absent from the ubuntu-latest (26.04) runner
        # image; 3.11 is what the retrieval server and lambdas actually run.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 flake8-bugbear pytest
          pip install -e .[dev]
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82,B019 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        run: |
          mkdir -p tests
          touch tests/__init__.py
          if [ ! -f tests/test_dummy.py ]; then echo "def test_dummy(): pass" > tests/test_dummy.py; fi
          pytest

  publish:
    name: PyPI
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: encoding-library
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -e .
      - name: Build package
        run: |
          rm -rf dist/
          python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages_dir: encoding-library/dist/
          skip_existing: true
