name: Pipeline

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  CDK_APP_PATH: ./genai-proxy-server-cdk
  SERVICE_APP_PATH: ./genai-proxy-server

permissions:
  contents: read
  id-token: write

jobs:
  build:
    environment: development
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.push-image.outputs.image-uri }}
      aws-region: ${{ steps.stack-outputs.outputs.aws-region }}
      ecr-repo: ${{ steps.stack-outputs.outputs.ecr-repo }}
      ecs-cluster: ${{ steps.stack-outputs.outputs.ecs-cluster }}
      ecs-service: ${{ steps.stack-outputs.outputs.ecs-service }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Install dependencies
        working-directory: ${{ env.CDK_APP_PATH }}
        run: |
          npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Deploy ECR stack (CDK)
        working-directory: ${{ env.CDK_APP_PATH }}
        run: npx cdk deploy EcrStack --require-approval never

      - name: Get ECR Repository URI
        id: get-ecr-uri
        run: |
          ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name $ECR_STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='EcrRepositoryUri'].OutputValue" \
            --output text)
          echo "ECR_URI=$ECR_URI" >> $GITHUB_ENV
          echo "Using ECR URI: $ECR_URI"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: ${{ env.SERVICE_APP_PATH }}
        run: |
          docker build -t $ECR_REPOSITORY_NAME .

      - name: Tag and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker tag $ECR_REPOSITORY_NAME:latest $ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy ECS stack (CDK)
        working-directory: ${{ env.CDK_APP_PATH }}
        env:
          IMAGE_URI: ${{ env.IMAGE_URI }}
        run: npx cdk deploy EcsStack --require-approval never
