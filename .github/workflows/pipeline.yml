name: Pipeline

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  CDK_APP_PATH: genai-proxy-server-cdk
  ENCODING_CDK_PATH: encoding-server-cdk
  SERVICE_APP_PATH: genai-proxy-server
  AUTH0_SPA_DOMAIN: ${{ secrets.AUTH0_SPA_DOMAIN }}
  AUTH0_SPA_CLIENT_ID: ${{ secrets.AUTH0_SPA_CLIENT_ID }}
  AUTH0_API_AUDIENCE: ${{ secrets.AUTH0_API_AUDIENCE }}

permissions:
  contents: read
  id-token: write

jobs:
  # Detect which services have changes
  detect-changes:
    name: Detect Deployment Targets
    runs-on: ubuntu-latest
    outputs:
      proxy-server: ${{ steps.filter.outputs.proxy-server }}
      encoding-server: ${{ steps.filter.outputs.encoding-server }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            proxy-server:
              - 'genai-proxy-server/**'
              - 'genai-proxy-server-cdk/**'
              - '.github/workflows/pipeline.yml'
              - '.github/workflows/proxy-server.yml'
            encoding-server:
              - 'encoding-server/**'
              - 'encoding-server-cdk/**'
              - '.github/workflows/pipeline.yml'
              - '.github/workflows/encoding-server.yml'

  proxy-server-development:
    name: Proxy Service
    needs: detect-changes
    if: needs.detect-changes.outputs.proxy-server == 'true'
    uses: ./.github/workflows/proxy-server.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      GH_PAT_TOKEN_FOR_FREE_ACCOUNT: ${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}
      AUTH0_SPA_DOMAIN: ${{ secrets.AUTH0_SPA_DOMAIN }}
      AUTH0_SPA_CLIENT_ID: ${{ secrets.AUTH0_SPA_CLIENT_ID }}
      AUTH0_API_AUDIENCE: ${{ secrets.AUTH0_API_AUDIENCE }}

  encoding-server-development:
    name: Encoding Service
    needs: detect-changes
    if: needs.detect-changes.outputs.encoding-server == 'true'
    uses: ./.github/workflows/encoding-server.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      GH_PAT_TOKEN_FOR_FREE_ACCOUNT: ${{ secrets.GH_PAT_TOKEN_FOR_FREE_ACCOUNT }}
      AUTH0_SPA_DOMAIN: ${{ secrets.AUTH0_SPA_DOMAIN }}
      ZILLIZ_ENDPOINT: ${{ secrets.ZILLIZ_ENDPOINT }}
      ZILLIZ_TOKEN: ${{ secrets.ZILLIZ_TOKEN }}
