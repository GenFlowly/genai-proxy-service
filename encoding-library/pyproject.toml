[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genflowly-encoding-library"
version = "0.1.40"
description = "Text encoding and chunking library."
dependencies = [
    "requests>=2.31.0",
    "boto3",
    "pydantic",
    "langchain-text-splitters",
    "tiktoken",
    "langchain-experimental",
    "langchain-openai",
    "langchain-voyageai",
    # voyageai 0.5.x: BaseClient.tokenizer is functools.lru_cache on an
    # instance method — embedding_utils' client cache and per-instance
    # tokenizer pinning are built around that layout; re-evaluate on a 0.6
    # upgrade.
    "voyageai>=0.5.0,<0.6"
]
requires-python = ">=3.9"

[project.optional-dependencies]
# Prometheus metric backend for long-running services (the Lambda EMF backend
# needs no extra dependency).
prometheus = [
    "prometheus-client"
]
dev = [
    "pytest",
    "flake8",
    # The shared-collection schema tests build real Milvus schemas (partition
    # key declaration) — plain pymilvus, without the [model] extra's ML stack.
    "pymilvus>=2.4.0"
]
# Local-embedding support (sentence-transformers pulls in torch, ~1GB RSS).
# get_embedding_model imports langchain_huggingface lazily, so API-only
# consumers (Voyage/OpenAI) can install without this extra.
ml = [
    "pymilvus[model]>=2.4.0",
    "langchain-huggingface",
    "sentence-transformers>=2.2.0",
    "scikit-learn",
    "scipy",
    "numpy<2.0.0"
]
