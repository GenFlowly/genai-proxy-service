app = "genai-proxy-server"
# Co-located with the data plane (DynamoDB/KMS/encoding server in us-east-1)
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"


[env]
  PORT = "8080"
  APP_ENV = "development"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# Fly's org Prometheus scrapes /metrics directly over the private network.
# The route itself 404s for traffic arriving through fly-proxy (public).
[metrics]
  port = 8080
  path = "/metrics"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"

