app = "genai-proxy-server"
# Co-located with the data plane (DynamoDB/KMS/encoding server in us-east-1)
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"


[env]
  PORT = "8080"
  APP_ENV = "development"
  # Dev logs the full INFO narrative (logback: ${LOG_LEVEL:-INFO})
  LOG_LEVEL = "INFO"
  # Batch-mode note documents, purged on account deletion (versioned bucket
  # owned by the encoding service's stacks)
  CUSTOMER_DOCUMENTS_BUCKET = "genflowly-development-customer-documents"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Dev only: everything stops when idle; fly-proxy boots a machine on the next request.
  min_machines_running = 0
  processes = ["app"]

# Fly's org Prometheus scrapes /metrics directly over the private network.
# The route itself 404s for traffic arriving through fly-proxy (public).
[metrics]
  port = 8080
  path = "/metrics"

# Right-sized 2026-09: CPU sat under 1% of one core; JVM is capped at
# -Xmx512m (Dockerfile), OS-level peak was ~656MB. Raise RAM if -Xmx grows.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"

