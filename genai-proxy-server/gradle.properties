kotlin.code.style=official
kotlin_version=2.2.20
ktor_version=3.3.0
logback_version=1.4.14

# The Kotlin compile needs more than Gradle's default 512 MB heap: at that
# size it runs out of memory about half the time (Fly builder and local container).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx1536m
