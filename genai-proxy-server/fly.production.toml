app = "genai-proxy-server-production"
# Co-located with the data plane (DynamoDB/KMS/encoding server in us-east-1)
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"


[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Production machines stay up to avoid multi-second JVM cold starts on first request.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
