app = "genai-proxy-server-production"
# Co-located with the data plane (DynamoDB/KMS/encoding server in us-east-1)
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"


[env]
  PORT = "8080"
  APP_ENV = "production"
  # Production logs problems only (logback: ${LOG_LEVEL:-INFO}); user content
  # is additionally gated off by APP_ENV — see development.md "Logging policy"
  LOG_LEVEL = "WARN"
  # Batch-mode note documents, purged on account deletion (versioned bucket
  # owned by the encoding service's stacks)
  CUSTOMER_DOCUMENTS_BUCKET = "genflowly-production-customer-documents"

[http_service]
  internal_port = 8080
  force_https = true
  # Production machines stay up to avoid multi-second JVM cold starts on first request.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # fly-proxy only routes to a machine once /health answers. Without a check it
  # sent requests to the JVM before Ktor was listening on 8080 ("instance
  # refused connection") on every restart. The JVM is ready in about 6s.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "10s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# Production runs a single machine, so the default rolling deploy stops it
# before its replacement is up. Blue-green boots the new machine next to the
# old one, waits for the /health check above, then moves traffic and destroys
# the old one. Two instances overlapping for a few seconds is safe: the
# PurgeJobWorker claim is conditional, and there are no volumes.
[deploy]
  strategy = "bluegreen"

# Fly's org Prometheus scrapes /metrics directly over the private network.
# The route itself 404s for traffic arriving through fly-proxy (public).
[metrics]
  port = 8080
  path = "/metrics"

# Right-sized 2026-09: CPU sat under 1% of one core; JVM is capped at
# -Xmx512m (Dockerfile), OS-level peak was ~656MB. Raise RAM if -Xmx grows.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
