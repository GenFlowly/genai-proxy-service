app = "genai-proxy-server-production"
# Co-located with the data plane (DynamoDB/KMS/encoding server in us-east-1)
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"


[env]
  PORT = "8080"
  APP_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  # Production machines stay up to avoid multi-second JVM cold starts on first request.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# Fly's org Prometheus scrapes /metrics directly over the private network.
# The route itself 404s for traffic arriving through fly-proxy (public).
[metrics]
  port = 8080
  path = "/metrics"

# Right-sized 2026-09: CPU sat under 1% of one core; JVM is capped at
# -Xmx512m (Dockerfile), OS-level peak was ~656MB. Raise RAM if -Xmx grows.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
