version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ktor-app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      # Decouple build artifacts to prevent conflicting with host system (Mac vs Linux binaries)
      - /app/build
      - /app/.gradle
      # Persist gradle cache to speed up startup
      - gradle-cache:/home/gradle/.gradle
      # Mount host AWS credentials for Lambda invocation
      - ~/.aws:/root/.aws:ro
    environment:
      # ✅ Core environment variables (mirroring GitHub Actions + ECS)
      AWS_REGION: us-east-1
      AWS_SECRET_ACCESS_KEY: "***REDACTED***"
      AWS_ACCESS_KEY_ID: "***REDACTED***"
      # Alias of the KmsStack key (stable across key replacements; encrypt accepts aliases,
      # decrypt never needs the id). Raw ARN of the current key: a83df245-9722-4eff-b016-1b2816be9ff2
      KMS_KEY_ID: "alias/gen-ai-proxy-service-development-vendor-api-key-encryption-key"
      AUTH0_SPA_DOMAIN: "auth.genflowly.com"
      AUTH0_SPA_CLIENT_ID: "VSKaAyEXLKM0LuZzJVhvH6RTT11LiNgE"
      AUTH0_API_AUDIENCE: "https://api-development.genflowly.com"
      RETRIEVAL_SERVER_URL: "http://retrieval-server:5001"
      ATTACHMENTS_BUCKET: "gen-ai-proxy-service-development-attachments"
      ENCODING_SERVER_URL: "${ENCODING_SERVER_URL:-}"
      # Admin allowlist for the admin-panel endpoints (/api/v1/admin/*)
      ADMIN_EMAILS: "support+secureadmin@genflowly.com"
      IMAGE_TAG: "local-dev"   # For local builds; in CI this is set from GITHUB_SHA
      # Google OAuth — required for Gmail/Calendar tool nodes.
      # Set actual values in .env (never commit them).
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      GOOGLE_OAUTH_REDIRECT_URI: "http://localhost:8080/api/v1/oauth/google/callback"
      # You can inject any other app-specific environment vars here, e.g.:
      # DATABASE_URL: postgres://user:pass@host/db
      # API_KEY: ${API_KEY}   # If you want to pass from .env
      JAVA_OPTS: "-Xmx512m -Xms256m -Djava.net.preferIPv4Stack=true"

    # Optional: load more env vars from a .env file for local dev secrets
    env_file:
      - .env

    # Restart policy like ECS
    restart: unless-stopped

    # Same healthcheck logic as Dockerfile
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  retrieval-server:
    build:
      context: ../retrieval-server
      dockerfile: Dockerfile
    container_name: retrieval-server
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "5001", "--workers", "1"]
    ports:
      - "5001:5001"
    environment:
      ZILLIZ_ENDPOINT: "${ZILLIZ_ENDPOINT}"
      ZILLIZ_TOKEN: "${ZILLIZ_TOKEN}"
      HF_HUB_DISABLE_XET: "1"
      AWS_REGION: "us-east-1"
      AWS_SECRET_ACCESS_KEY: "***REDACTED***"
      AWS_ACCESS_KEY_ID: "***REDACTED***"
      KMS_KEY_ID: "alias/gen-ai-proxy-service-development-vendor-api-key-encryption-key"
      ATTACHMENTS_BUCKET: "gen-ai-proxy-service-development-attachments"
      # If using SSO or dynamic credentials, mounting ~/.aws is preferred
      # Or you can inject temporary credentials via .env in the env_file below
    volumes:
      - ~/.aws:/root/.aws:ro
      - hf-model-cache:/app/model_cache
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  gradle-cache:
  hf-model-cache:   # persists the embedding model across container restarts
