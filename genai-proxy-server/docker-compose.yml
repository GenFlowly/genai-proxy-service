version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genai-proxy-server
    ports:
      - "8080:8080"
    environment:
      # Pass any environment variables your app needs here
      JAVA_OPTS: "-Xmx512m -Xms256m"
    restart: unless-stopped
